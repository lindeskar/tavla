[project]
name = "tavla"
version = "0.1.0"
description = "Terminal kanban of GitHub issues with the Claude Code sessions working on each"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexander Lindeskär" }]
requires-python = ">=3.14"
keywords = ["claude-code", "github-issues", "kanban", "tui", "textual"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = ["textual==8.2.8"]

[project.urls]
Repository = "https://github.com/lindeskar/tavla"
Issues = "https://github.com/lindeskar/tavla/issues"

[project.scripts]
tavla = "tavla.__main__:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff==0.17.4",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
line-length = 200
